services:
  postgres:
    image: postgres:17
    container_name: postgres_grpc
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sos11982
      POSTGRES_DB: grpc_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: grpc-app
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: sos11982
      DB_NAME: grpc_test
volumes:
  postgres_data: